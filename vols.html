<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vols · le prix au jour le jour</title>

<!-- Cette page n'est plus le chemin normal : le prix des vols est un onglet
     d'index.html et de routes.html. Elle reste pour les liens déjà partagés,
     et sert le même panneau, depuis le même vols.js. -->

<style>
:root{
  --deep:#0D2422;
  --zhu:#E24A3C;
  --pap:#F7F5F0; --card:#FFFFFF;
  --tx:#14201F; --tx2:#63706E; --line:#14201f1a;
  --onDark:#F1F5F4; --onDark2:#B9C6C4;
  --r:18px;
  --ff:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --pap:#0B1817; --card:#132524; --tx:#EDF2F1; --tx2:#8FA09E; --line:#edf2f114; }
}
:root[data-theme="light"]{ --pap:#F7F5F0; --card:#FFFFFF; --tx:#14201F; --tx2:#63706E; --line:#14201f1a; }
:root[data-theme="dark"]{ --pap:#0B1817; --card:#132524; --tx:#EDF2F1; --tx2:#8FA09E; --line:#edf2f114; }

*{box-sizing:border-box}
body{margin:0;background:var(--pap);color:var(--tx);font-family:var(--ff);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.06}
.pg{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3.4vw,40px)}
.lbl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx2);font-weight:700}

.top{background:var(--deep);color:var(--onDark);padding:clamp(22px,3.4vw,40px) 0}
.top .lbl{color:var(--onDark2)}
.top h1{font-size:clamp(30px,5.4vw,58px);margin-top:8px;letter-spacing:-.045em;text-transform:uppercase;font-weight:900}
.top p{font-size:15px;margin:12px 0 0;max-width:56ch;color:var(--onDark2)}
.top .go{display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:9px 17px;border-radius:100px;
  background:var(--zhu);color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.panel{padding:clamp(20px,2.4vw,32px) 0}
</style>
</head>
<body>

<header class="top">
  <div class="pg">
    <span class="lbl">Vols internationaux</span>
    <h1>Le prix au jour le jour</h1>
    <p>Un relevé automatique chaque matin, sur les quatre combinaisons qui nous intéressent.
      Le graphe ne dit pas quoi faire : il dit si le prix monte, descend, ou ne bouge pas.</p>
    <a class="go" href="index.html#p-vols">Voir dans le site complet</a>
  </div>
</header>

<main class="pg">
  <div class="panel"><div id="volsbox"></div></div>
</main>

<script src="vols.js"></script>
<script>VOLS.mount("volsbox");</script>
</body>
</html>
